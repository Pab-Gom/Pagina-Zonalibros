<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona-Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <section class="container-fluid p-0">
        <img src="images/portada.png" class="img-fluid w-100" alt="Portada Zona Libros">
        <nav id="intro" class="d-flex justify-content-between recuadro-1">
            <a href="#home" class="btn btn-dark px-5 btn-lg">Home</a>
            <a href="#login">
                <button id="boton-login" class="btn btn-dark px-5 py-2 boton-login">
                    Login
                </button>
            </a>
        </nav>
        </section>
        <section id="navegacion" class="container d-flex justify-content-between recuadro-2">          
            <a href="#libros"><h4>Libros</h4></a>
            <a href="#categorias"><h4>Categorias</h4></a>
            <a href="#ofertas"><h4>Ofertas</h4></a>
            <a href="#novedades"><h4>Novedades</h4></a>
            <a href="#contactos"><h4>Contactos</h4></a>
        </section>
        
    </header>

    <main>
        <section id="inicio-sesion">
            <div id="inicio-datos" class="alert alert-success mt-3 d-none login-usuario">
                <h3>Login Usuario</h3>
                <div class="recuadro-4">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-8 col-lg-6">
                            <form action="" id="form-login" class="recuadro-4">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">
                                        Correo
                                    </label>
                                    <input type="text"
                                    id="correo"
                                    class="form-control"
                                    placeholder="Ingrese su correo">
                                </div>
                                <div class="mb-3">
                                    <label for="contrasena" class="form-label">
                                        Contraseña
                                    </label>
                                    <input type="text"
                                    id="contrasena"
                                    class="form-control"
                                    placeholder="Ingrese su contrasena">
                                </div>
                                
                            </form>
                        </div>
                    </div>
                </div>
                <button id="registro" class="btn btn-dark px-5 py-2 boton-registro">
                    Registrarse
                </button>
            </div>
            
        </section>

        <section id="libros" class="recuadro-1">
            <div class="recuadro-libros">
                <div class="portada-libros">

                </div>
                <h2>Libros Disponibles</h2>
            </div>
        </section>

        <section id="categorias" class="recuadro-1">
            <div class="recuadro-libros">
                <h2>Categorias</h2>
            </div>
        </section>

        <section id="ofertas" class="recuadro-1">
            <div class="recuadro-libros">
                <h2>Ofertas</h2>
            </div>

        </section>

        <section id="novedades" class="recuadro-1">
            <div class="recuadro-libros">
                <h2>Novedades</h2>
            </div>
        </section>


    </main>

    <footer id="contactos" class="recuadro-3">
        <div>
            <p>Zona-Libros - Quilpue - 2026</p>
        </div>
    </footer>
 
</body>
</html>
